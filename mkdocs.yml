# Docs site (D-01). Build: `make docs` (strict: a broken link fails). The public handbook only;
# plans, QA evidence, ADRs, runbooks and the threat model stay internal (exclude_docs).
site_name: Nexiqon documentation
site_description: Build, run and secure Nexiqon assistants.
docs_dir: docs
site_dir: site
strict: true

exclude_docs: |
  plan/
  qa/
  adr/
  ux/
  design/
  diagrams/
  runbooks/
  security/

nav:
  - Home: index.md
  - Quickstart: handbook/quickstart.md
  - Build:
      - Domain Packs: handbook/domain-packs.md
      - Plugin SDK: handbook/plugin-sdk.md
      - Widget accessibility: guides/widget-accessibility.md
  - API reference:
      - Overview: handbook/api/index.md
      - Conversations: handbook/api/conversation.md
      - Channels: handbook/api/channel.md
      - Assistant runs: handbook/api/agent-runtime.md
      - Ingestion: handbook/api/ingestion.md
      - Retrieval: handbook/api/retrieval.md
      - Tools: handbook/api/tool-gateway.md
      - Configuration: handbook/api/config.md
      - Identity: handbook/api/identity.md
      - Evaluations: handbook/api/evaluation.md
      - Metering: handbook/api/metering.md
      - Notifications: handbook/api/notification.md
      - Governance: handbook/api/governance.md
      - Audit: handbook/api/audit.md
  - Install:
      - Choose an option: handbook/install/index.md
      - SaaS: handbook/install/saas.md
      - Hybrid: handbook/install/hybrid.md
      - Private (Kubernetes): handbook/install/private.md
      - Single node: handbook/install/single-node.md
      - Air-gapped: handbook/install/air-gapped.md
      - Minimal footprint: guides/minimal-footprint.md
      - GPU models: guides/gpu-models.md
  - Security: handbook/security.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Light mode }
  font: false   # system fonts: no request to Google Fonts (works offline and air-gapped)
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
