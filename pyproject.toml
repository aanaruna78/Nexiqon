# Nexiqon uv workspace root (virtual: not a package itself).
[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "testcontainers[postgres]>=4.9",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-PyYAML>=6.0",
  "pre-commit>=4.0",
  "copier>=9.4",
  "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["templates", "frontend", "node_modules"]
src = ["libs/*/src", "services/*/src", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "PT", "SIM", "TID"]
ignore = ["S101", "E501"]  # assert is fine; line length is left to ruff format

[tool.ruff.lint.isort]
known-first-party = ["nexiqon_core", "nexiqon_sdk"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S608", "PT012"]
# RLS policy SQL in migrations is built from constants and setting() expressions, never input.
"**/migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["templates/", "build/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["integration: needs Docker (testcontainers)"]
