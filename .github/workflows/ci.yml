name: CI

on:
  # Every branch push runs CI (phase branches get green evidence before merging); PRs add the
  # breaking-contract comparison.
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, architecture, contracts, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy libs/*/src services/*/src
      - run: uv run python tools/lint/check_architecture.py
      - run: uv run python -m tools.contracts.export_openapi --check
      - run: uv run pytest --cov=libs --cov=services --cov-report=term-missing:skip-covered

  policies:
    name: Authorization policies (OPA unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: opa test
        run: docker run --rm -v "$PWD/services/authz/policies:/policies:ro" openpolicyagent/opa:0.70.0 test /policies -v

  contracts-breaking:
    name: Contracts (breaking changes vs base)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare OpenAPI contracts with oasdiff
        run: |
          base="origin/${{ github.base_ref }}"
          mkdir -p /tmp/base
          status=0
          for f in contracts/openapi/*.json; do
            name=$(basename "$f")
            git show "$base:contracts/openapi/$name" > "/tmp/base/$name" 2>/dev/null || continue
            docker run --rm -v /tmp/base:/base -v "$PWD/contracts/openapi":/head tufin/oasdiff:v1.34.1 \
              breaking "/base/$name" "/head/$name" --fail-on ERR || status=1
          done
          exit $status

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: pnpm generate && git diff --exit-code -- packages/client
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Storybook builds (design-system catalog, a11y addon)
        run: pnpm --filter @nexiqon/studio build-storybook

  helm:
    name: Deployment (Helm chart, OpenTofu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PyYAML for reading rendered manifests
        run: python3 -m pip install --user --quiet pyyaml==6.0.2
      - name: Lint and render every profile
        run: |
          H="docker run --rm -v $PWD/deploy/helm/nexiqon:/chart -w /chart alpine/helm:3.19.0"
          $H lint . -f values/kind.yaml
          mkdir -p /tmp/render
          $H template t . -f values/kind.yaml > /tmp/render/kind-grouped.yaml
          $H template t . -f values/kind.yaml --set topology.mode=split > /tmp/render/kind-split.yaml
          $H template t . -f values/saas.yaml > /tmp/render/saas.yaml
          $H template t . -f values/private.yaml --set studio.baseUrl=https://studio.example --set studio.oidc.issuer=https://login.example > /tmp/render/private.yaml
      - name: Kubernetes schemas
        run: docker run --rm -v /tmp/render:/m:ro ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.31.0 /m
      - name: Generated gateway config is valid Envoy
        run: |
          for f in kind-grouped kind-split; do
            python3 -c "import sys, yaml; [print(d['data']['envoy.yaml']) for d in yaml.safe_load_all(open(sys.argv[1])) if d and d['kind'] == 'ConfigMap' and d['metadata']['name'] == 'nexiqon-gateway']" /tmp/render/$f.yaml > /tmp/render/$f-envoy.yaml
            docker run --rm -v /tmp/render/$f-envoy.yaml:/e.yaml:ro envoyproxy/envoy:v1.40.0 --mode validate -c /e.yaml
          done
      - name: OpenTofu format and validate (no backend, no credentials)
        run: |
          T="ghcr.io/opentofu/opentofu:1.10.6"
          docker run --rm -v $PWD/deploy/tofu:/w -w /w $T fmt -check -recursive
          for d in modules/digitalocean envs/staging; do
            docker run --rm -v $PWD/deploy/tofu:/w -w /w/$d $T init -backend=false -input=false -no-color
            docker run --rm -v $PWD/deploy/tofu:/w -w /w/$d $T validate -no-color
          done

  security:
    name: Security (secrets, dependencies, filesystem)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - name: pip-audit
        run: |
          uv export --frozen --all-packages --no-dev --no-hashes --no-emit-workspace -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --strict
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (pinned by SHA)
        with:
          scan-type: fs
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  image:
    name: Container image (build, smoke test, scan)
    runs-on: ubuntu-24.04
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: nexiqon/platform:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test a group
        run: |
          docker run -d --name grp -p 8000:8000 -e NEXIQON_GROUP=control-core nexiqon/platform:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs localhost:8000/identity/meta
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (pinned by SHA)
        with:
          image-ref: nexiqon/platform:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Build the Studio image (with the widget bundle)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: deploy/docker/studio.Dockerfile
          tags: nexiqon/studio:ci
          load: true
          cache-from: type=gha,scope=studio
          cache-to: type=gha,mode=max,scope=studio
      - name: Smoke test Studio and the public widget bundle
        run: |
          docker run -d --name studio -p 3000:3000 -e STUDIO_SESSION_SECRET=$(openssl rand -hex 32) nexiqon/studio:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/api/health && break; sleep 1; done
          curl -fsI localhost:3000/widget/nexiqon-chat.js | grep -i "access-control-allow-origin: \*"
      - name: Trivy Studio image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (pinned by SHA)
        with:
          image-ref: nexiqon/studio:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
