[project]
name = "nexiqon-core"
version = "0.1.0"
description = "Nexiqon service chassis: settings, tenancy, RLS sessions, errors, logging, telemetry, outbox, group runner"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "PyYAML>=6.0",
  "SQLAlchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "PyJWT[crypto]>=2.10",
  "structlog>=24.4",
  "opentelemetry-api>=1.29",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.scripts]
nexiqon-run = "nexiqon_core.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexiqon_core"]
