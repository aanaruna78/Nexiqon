[project]
name = "nexiqon-notification"
version = "0.1.0"
description = "Email, webhook and in-app notifications"
requires-python = ">=3.12,<3.14"
dependencies = ["nexiqon-core"]

[tool.uv.sources]
nexiqon-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexiqon_notification"]
