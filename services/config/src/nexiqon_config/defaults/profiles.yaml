# Built-in profiles used when a tenant has not defined (and deployed) its own with the same name.
# Model names are defaults pending the M-07 bake-off; tenants override by creating a profile.
model_profile:
  cloud-frontier:
    chat: { provider: openai, model: gpt-4.1, temperature: 0.2, max_output_tokens: 1200 }
    embedding: { provider: openai, model: text-embedding-3-small, dimensions: 1024 }
    reranker: { enabled: false }
    capabilities: { tool_calling: true, json_schema_output: true, context_tokens: 128000 }
    data_policy: { location: cloud, allow_training: false }
    routing:
      - { classification: confidential, use_profile: on-prem-standard }
      - { classification: restricted, use_profile: on-prem-standard }
    fallback_profile: cloud-frontier-backup
    timeout_seconds: 60
  cloud-frontier-backup:
    chat: { provider: anthropic, model: claude-sonnet-5-5, temperature: 0.2, max_output_tokens: 1200 }
    embedding: { provider: openai, model: text-embedding-3-small, dimensions: 1024 }
    reranker: { enabled: false }
    capabilities: { tool_calling: true, json_schema_output: true, context_tokens: 200000 }
    data_policy: { location: cloud, allow_training: false }
    timeout_seconds: 60
  on-prem-standard:
    chat: { provider: openai_compatible, model: qwen3.6-35b-a3b, base_url: "http://vllm:8000/v1", temperature: 0.2 }
    embedding: { provider: openai_compatible, model: qwen3-embedding-0.6b, base_url: "http://vllm-embed:8000/v1", dimensions: 1024 }
    reranker: { enabled: true, provider: openai_compatible, model: qwen3-reranker-0.6b, base_url: "http://vllm-rerank:8000/v1" }
    capabilities: { tool_calling: true, json_schema_output: true, context_tokens: 32768 }
    data_policy: { location: on_prem, allow_training: false }
  on-prem-small:
    chat: { provider: openai_compatible, model: qwen3-8b, base_url: "http://vllm:8000/v1", temperature: 0.2 }
    embedding: { provider: openai_compatible, model: qwen3-embedding-0.6b, base_url: "http://vllm-embed:8000/v1", dimensions: 1024 }
    reranker: { enabled: true, provider: openai_compatible, model: qwen3-reranker-0.6b, base_url: "http://vllm-rerank:8000/v1" }
    capabilities: { tool_calling: true, json_schema_output: false, context_tokens: 32768 }
    data_policy: { location: on_prem, allow_training: false }
  # Development stacks without API keys or GPUs: deterministic stand-ins, NOT language models.
  # Works only where the model gateway enables the offline provider (allow_offline_provider).
  dev-offline:
    chat: { provider: offline, model: extractive, max_output_tokens: 400 }
    embedding: { provider: offline, model: hash-ngram-1024, dimensions: 1024 }
    reranker: { enabled: true, provider: offline, model: lexical }
    capabilities: { tool_calling: false, json_schema_output: false, context_tokens: 32768 }
    data_policy: { location: on_prem, allow_training: false }
retrieval_profile:
  standard:
    chunking: { strategy: heading_aware, max_tokens: 400, overlap_tokens: 40 }
    search: { top_k: 8, vector_weight: 0.6, keyword_weight: 0.4, rerank: false }
    small_to_big: { enabled: true, max_context_tokens: 3000 }
    summary_nodes: false
    min_evidence_score: 0.55
  # Hash embeddings score lower than real models; pair with the dev-offline model profile.
  dev-offline:
    chunking: { strategy: heading_aware, max_tokens: 200, overlap_tokens: 20 }
    search: { top_k: 6, vector_weight: 0.6, keyword_weight: 0.4, rerank: false }
    small_to_big: { enabled: true, max_context_tokens: 3000 }
    summary_nodes: false
    min_evidence_score: 0.15
retention_profile:
  standard:
    conversations_days: 365
    traces_days: 30
    tool_results_days: 30
    legal_hold: false
