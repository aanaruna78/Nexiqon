[project]
name = "nexiqon-agent-runtime"
version = "0.1.0"
description = "Declarative LangGraph agent execution"
requires-python = ">=3.12,<3.14"
dependencies = ["nexiqon-core", "langgraph==1.2.17"]

[tool.uv.sources]
nexiqon-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexiqon_agent_runtime"]
