[project]
name = "nexiqon-identity"
version = "0.1.0"
description = "Tenants, users, memberships, IdP adapters and tenant-context tokens"
requires-python = ">=3.12,<3.14"
dependencies = ["nexiqon-core"]

[tool.uv.sources]
nexiqon-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexiqon_identity"]
