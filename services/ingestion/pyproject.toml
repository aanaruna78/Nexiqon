[project]
name = "nexiqon-ingestion"
version = "0.1.0"
description = "Source connectors, parsing, chunking, embedding and document lifecycle"
requires-python = ">=3.12,<3.14"
dependencies = [
  "nexiqon-core",
  "nexiqon-sdk",
  "pypdf==6.21.2",
  "python-docx>=1.2.0",
  "beautifulsoup4>=4.15.0",
  "markdown-it-py>=4.0",
]

[tool.uv.sources]
nexiqon-core = { workspace = true }
nexiqon-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexiqon_ingestion"]

[project.entry-points."nexiqon.plugins"]
builtin = "nexiqon_ingestion.plugins:builtin"
