[project]
name = "nexiqon-model-gateway"
version = "0.1.0"
description = "LLM, embedding and reranker providers with routing, budgets and redaction"
requires-python = ">=3.12,<3.14"
dependencies = ["nexiqon-core"]

[tool.uv.sources]
nexiqon-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexiqon_model_gateway"]
