[project]
name = "nexiqon-authz"
version = "0.1.0"
description = "Policy decisions (OPA) for role, resource and action authorization"
requires-python = ">=3.12,<3.14"
dependencies = ["nexiqon-core"]

[tool.uv.sources]
nexiqon-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexiqon_authz"]
