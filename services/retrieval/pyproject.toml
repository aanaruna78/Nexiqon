[project]
name = "nexiqon-retrieval"
version = "0.1.0"
description = "Hybrid search, ACL filtering, small-to-big expansion and citation verification"
requires-python = ">=3.12,<3.14"
dependencies = ["nexiqon-core"]

[tool.uv.sources]
nexiqon-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexiqon_retrieval"]
