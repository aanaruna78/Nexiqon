# Non-secret settings layer for the local stack (NEXIQON_CONFIG_FILES). Secrets: dev-secrets.yaml.
environment: dev
log_json: false
require_admin_mfa: false          # local Keycloak users have no MFA
context_cache_seconds: 30
opa_url: http://opa:8181
idp_providers:
  - name: keycloak
    kind: keycloak
    # Browser-facing issuer (KC_HOSTNAME); JWKS fetched over the compose network.
    issuer: http://localhost:8080/realms/nexiqon
    jwks_url: http://keycloak:8080/realms/nexiqon/protocol/openid-connect/certs
    audiences: []
events:
  enabled: true
  nats_url: nats://nats:4222
flags:
  provider: flagd
  flagd_host: flagd
  flagd_port: 8013
workflows:
  address: temporal:7233
# Model gateway: serve the deterministic "offline" provider (profile dev-offline) so the local stack
# indexes and answers without API keys or GPUs. Not a language model; never enable in production.
allow_offline_provider: true
