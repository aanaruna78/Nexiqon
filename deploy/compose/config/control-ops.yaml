# Control-ops group (evaluation, metering, governance, notification) on the local stack.
# Evaluation runs are Temporal workflows (QA-01).
workflows:
  enabled: true
  address: temporal:7233
# Outgoing email goes to Mailpit (development only).
email:
  backend: smtp
  host: mailpit
  port: 1025
  starttls: false
  sender: "Nexiqon dev <no-reply@nexiqon.local>"
# Governance: export archives in the object store; a short deletion grace period for development.
blobs:
  backend: s3
  endpoint: http://objectstore:8333
  bucket: nexiqon
  access_key: nexiqon-dev
  secret_key: nexiqon-dev-secret
deletion_grace_hours: 0.05
