# Generated from the Helm chart by tools/bundle/single_node_gateway.py. Do not edit:
# change the chart and generate again (CI checks the two agree).
static_resources:
  listeners:
    - name: public
      address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: public
                use_remote_address: true
                server_header_transformation: PASS_THROUGH
                generate_request_id: true
                route_config:
                  name: nexiqon
                  virtual_hosts:
                    - name: nexiqon
                      domains: ["*"]
                      # S-02: API responses are never sniffed, framed or cached by shared caches.
                      response_headers_to_add:
                        - { header: { key: x-content-type-options, value: nosniff }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                        - { header: { key: x-frame-options, value: DENY }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                        - { header: { key: referrer-policy, value: no-referrer }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                        - { header: { key: strict-transport-security, value: "max-age=63072000; includeSubDomains" }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                      response_headers_to_remove: [server, x-envoy-upstream-service-time]
                      routes:
                        - match: { path: /gateway/healthz }
                          direct_response: { status: 200, body: { inline_string: "ok" } }
                          typed_per_filter_config: &no_authz
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: /identity/internal/ }
                          direct_response: { status: 404 }
                          typed_per_filter_config: *no_authz
                        - match: { prefix: /authz/ }
                          direct_response: { status: 404 }
                          typed_per_filter_config: *no_authz
                        - match: { prefix: /model-gateway/ }
                          direct_response: { status: 404 }
                          typed_per_filter_config: *no_authz
                        - match: { prefix: /config-mirror/ }
                          direct_response: { status: 404 }
                          typed_per_filter_config: *no_authz
                        - match: { prefix: /identity/v1/session/ }
                          route: { cluster: control-core }
                          typed_per_filter_config: *no_authz
                        - match: { prefix: /identity/v1/webhooks/ }
                          route: { cluster: control-core }
                          typed_per_filter_config: *no_authz
                        - match: { prefix: /identity/.well-known/ }
                          route: { cluster: control-core }
                          typed_per_filter_config: *no_authz
                        - match: { prefix: /config/.well-known/ }
                          route: { cluster: control-core }
                          typed_per_filter_config: *no_authz
                        - match: { prefix: /agent-runtime/ }
                          route: { cluster: agent, timeout: 180s }
                        - match: { prefix: /conversation/ }
                          route: { cluster: agent, timeout: 180s }
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match: [{ safe_regex: { regex: "https?://.+" } }]
                              allow_methods: "GET, POST, DELETE, OPTIONS"
                              allow_headers: "authorization, content-type, x-nexiqon-visitor, x-nexiqon-tenant"
                              max_age: "600"
                              allow_credentials: false
                        - match: { prefix: /channel/ }
                          route: { cluster: agent }
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match: [{ safe_regex: { regex: "https?://.+" } }]
                              allow_methods: "GET, POST, DELETE, OPTIONS"
                              allow_headers: "authorization, content-type, x-nexiqon-visitor, x-nexiqon-tenant"
                              max_age: "600"
                              allow_credentials: false
                        - match: { prefix: /identity/ }
                          route: { cluster: control-core }
                        - match: { prefix: /config/ }
                          route: { cluster: control-core }
                        - match: { prefix: /audit/ }
                          route: { cluster: control-core }
                        - match: { prefix: /evaluation/ }
                          route: { cluster: control-ops }
                        - match: { prefix: /metering/ }
                          route: { cluster: control-ops }
                        - match: { prefix: /governance/ }
                          route: { cluster: control-ops }
                        - match: { prefix: /notification/ }
                          route: { cluster: control-ops }
                        - match: { prefix: /ingestion/ }
                          route: { cluster: knowledge }
                        - match: { prefix: /retrieval/ }
                          route: { cluster: knowledge }
                        - match: { prefix: /tool-gateway/ }
                          route: { cluster: tool-gateway }
                http_filters:
                  # S-02: a flood ceiling per gateway pod (429 above it). Per-key limits are
                  # applied by the services (tool-gateway) and budgets (model-gateway).
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: gateway_ratelimit
                      token_bucket:
                        max_tokens: 400
                        tokens_per_fill: 200
                        fill_interval: 1s
                      filter_enabled: { default_value: { numerator: 100, denominator: HUNDRED } }
                      filter_enforced: { default_value: { numerator: 100, denominator: HUNDRED } }
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-nexiqon-context
                          - remove: x-nexiqon-diagnostics
                          - remove: x-nexiqon-region
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      http_service:
                        server_uri:
                          uri: http://control-core:8000
                          cluster: control-core
                          timeout: 2s
                        path_prefix: /identity/internal/ext-authz
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: authorization
                              - exact: x-nexiqon-tenant
                              - exact: origin
                              - exact: x-nexiqon-visitor
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-nexiqon-context
                              - exact: x-nexiqon-region
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: agent
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: agent
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: agent, port_value: 8000 } } } }] }]
    - name: control-core
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: control-core
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: control-core, port_value: 8000 } } } }] }]
    - name: control-ops
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: control-ops
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: control-ops, port_value: 8000 } } } }] }]
    - name: knowledge
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: knowledge
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: knowledge, port_value: 8000 } } } }] }]
    - name: tool-gateway
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: tool-gateway
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: tool-gateway, port_value: 8000 } } } }] }]
