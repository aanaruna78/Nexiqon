{{- if .Values.gateway.enabled }}
{{- $port := int .Values.topology.port }}
{{- $identity := include "nexiqon.hostFor" (list . "identity") }}
{{- $cp := .Values.controlPlane }}
{{- $remote := and (not $identity) $cp.host }}
{{- $link := .Values.gateway.dataPlaneLink }}
{{- $cells := .Values.cells | default dict }}
{{- $internal := list "authz" "model-gateway" "config-mirror" }}
{{- $streaming := list "agent-runtime" "conversation" }}
{{- $widget := list "conversation" "channel" }}
{{- $hosts := dict }}
# Edge gateway (PL-01), generated from the groups: strips any client-sent context header and the
# diagnostics proof, asks identity (ext_authz) for a signed tenant context, routes /<service>/...
# Internal-only services (authz, model-gateway) and /identity/internal/* are never routed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexiqon-gateway
  labels: {{- include "nexiqon.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: public
          address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: public
                    use_remote_address: true
                    server_header_transformation: PASS_THROUGH
                    generate_request_id: true
                    route_config:
                      name: nexiqon
                      virtual_hosts:
                        - name: nexiqon
                          domains: ["*"]
                          # S-02: API responses are never sniffed, framed or cached by shared caches.
                          response_headers_to_add:
                            - { header: { key: x-content-type-options, value: nosniff }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                            - { header: { key: x-frame-options, value: DENY }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                            - { header: { key: referrer-policy, value: no-referrer }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                            {{- if .Values.gateway.hsts }}
                            - { header: { key: strict-transport-security, value: "max-age=63072000; includeSubDomains" }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                            {{- end }}
                          response_headers_to_remove: [server, x-envoy-upstream-service-time]
                          routes:
                            - match: { path: /gateway/healthz }
                              direct_response: { status: 200, body: { inline_string: "ok" } }
                              typed_per_filter_config: &no_authz
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                            - match: { prefix: /identity/internal/ }
                              direct_response: { status: 404 }
                              typed_per_filter_config: *no_authz
                            {{- range $cell, $c := $cells }}
                            # DV-07: tenants of the {{ $cell }} region are served by their own cell.
                            - match: { prefix: /, headers: [{ name: x-nexiqon-region, string_match: { exact: {{ $cell | quote }} } }] }
                              route: { cluster: {{ printf "cell-%s" $cell }}, timeout: 180s, auto_host_rewrite: true }
                            {{- end }}
                            {{- range $svc := $internal }}
                            - match: { prefix: /{{ $svc }}/ }
                              direct_response: { status: 404 }
                              typed_per_filter_config: *no_authz
                            {{- end }}
                            {{- /* Unauthenticated identity and config paths; on a hybrid data plane they are
                                   the control plane's, reached over the link. */}}
                            {{- $config := include "nexiqon.hostFor" (list $ "config") }}
                            {{- range $p := list "/identity/v1/session/" "/identity/v1/webhooks/" "/identity/.well-known/" "/config/.well-known/" }}
                            {{- $to := ternary $config $identity (hasPrefix "/config/" $p) }}
                            {{- if or $to (and $remote (ne $p "/identity/v1/webhooks/")) }}
                            - match: { prefix: {{ $p }} }
                              route: { cluster: {{ $to | default "control-plane" }}{{ if not $to }}, auto_host_rewrite: true{{ end }} }
                              typed_per_filter_config: *no_authz
                            {{- end }}
                            {{- end }}
                            {{- range $name, $g := .Values.groups }}
                            {{- if $g.enabled }}
                            {{- range $svc := $g.services }}
                            {{- if not (has $svc $internal) }}
                            {{- $host := include "nexiqon.hostFor" (list $ $svc) }}
                            {{- $_ := set $hosts $host true }}
                            - match: { prefix: /{{ $svc }}/ }
                              route: { cluster: {{ $host }}{{ if has $svc $streaming }}, timeout: 180s{{ end }} }
                              {{- if has $svc $widget }}
                              typed_per_filter_config:
                                envoy.filters.http.cors:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                                  allow_origin_string_match: [{ safe_regex: { regex: {{ $.Values.gateway.corsOriginRegex | quote }} } }]
                                  allow_methods: "GET, POST, DELETE, OPTIONS"
                                  allow_headers: "authorization, content-type, x-nexiqon-visitor, x-nexiqon-tenant"
                                  max_age: "600"
                                  allow_credentials: false
                              {{- end }}
                            {{- end }}
                            {{- end }}
                            {{- end }}
                            {{- end }}
                    http_filters:
                      {{- with .Values.gateway.rateLimit }}
                      {{- if .enabled }}
                      # S-02: a flood ceiling per gateway pod (429 above it). Per-key limits are
                      # applied by the services (tool-gateway) and budgets (model-gateway).
                      - name: envoy.filters.http.local_ratelimit
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                          stat_prefix: gateway_ratelimit
                          token_bucket:
                            max_tokens: {{ .burst }}
                            tokens_per_fill: {{ .perSecond }}
                            fill_interval: 1s
                          filter_enabled: { default_value: { numerator: 100, denominator: HUNDRED } }
                          filter_enforced: { default_value: { numerator: 100, denominator: HUNDRED } }
                      {{- end }}
                      {{- end }}
                      - name: envoy.filters.http.cors
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      - name: envoy.filters.http.header_mutation
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                          mutations:
                            request_mutations:
                              - remove: x-nexiqon-context
                              - remove: x-nexiqon-diagnostics
                              - remove: x-nexiqon-region
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          failure_mode_allow: false
                          {{- if $cells }}
                          clear_route_cache: true   # route again once the tenant's region is known
                          {{- end }}
                          http_service:
                            server_uri:
                              {{- if $remote }}
                              uri: https://{{ $cp.host }}:{{ $cp.port }}
                              cluster: control-plane
                              timeout: 5s
                              {{- else }}
                              uri: http://{{ $identity }}:{{ $port }}
                              cluster: {{ $identity }}
                              timeout: 2s
                              {{- end }}
                            path_prefix: /identity/internal/ext-authz
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: authorization
                                  - exact: x-nexiqon-tenant
                                  - exact: origin
                                  - exact: x-nexiqon-visitor
                            authorization_response:
                              allowed_upstream_headers:
                                patterns:
                                  - exact: x-nexiqon-context
                                  - exact: x-nexiqon-region
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        {{- if $remote }}
        # Hybrid data plane (DV-04): in-cluster only. Data-plane services reach the control plane
        # through here; Envoy adds this data plane's client certificate (mTLS) and connects out.
        - name: control-link
          address: { socket_address: { address: 0.0.0.0, port_value: 8081 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: control_link
                    route_config:
                      virtual_hosts:
                        - name: control-plane
                          domains: ["*"]
                          routes:
                            - match: { prefix: / }
                              route: { cluster: control-plane, timeout: 30s, auto_host_rewrite: true }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        {{- end }}
        {{- if $link.enabled }}
        # Control plane (DV-04): the link data planes connect to. Mutual TLS, client certificates from
        # the data planes' CA only, and only the paths a data plane needs.
        - name: data-plane-link
          address: { socket_address: { address: 0.0.0.0, port_value: 8443 } }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain: { filename: /etc/nexiqon/link-server/tls.crt }
                        private_key: { filename: /etc/nexiqon/link-server/tls.key }
                    validation_context:
                      trusted_ca: { filename: /etc/nexiqon/link-server/ca.crt }
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: data_plane_link
                    route_config:
                      virtual_hosts:
                        - name: link
                          domains: ["*"]
                          routes:
                            {{- range $p := list "/identity/internal/ext-authz/" "/identity/v1/session/" "/identity/.well-known/" "/config/v1/snapshots/" "/config/v1/resolve/" "/config/.well-known/" "/notification/v1/emails" }}
                            {{- $svc := index (splitList "/" $p) 1 }}
                            - match: { prefix: {{ $p }} }
                              route: { cluster: {{ include "nexiqon.hostFor" (list $ $svc) }} }
                            {{- end }}
                            - match: { prefix: / }
                              direct_response: { status: 404 }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        {{- end }}
      clusters:
        {{- if $identity }}{{ $_ := set $hosts $identity true }}{{ end }}
        {{- if $link.enabled }}
        {{- range $svc := list "identity" "config" "notification" }}{{ $_ := set $hosts (include "nexiqon.hostFor" (list $ $svc)) true }}{{ end }}
        {{- end }}
        {{- if $remote }}
        {{- include "nexiqon.tlsCluster" (list "control-plane" $cp.host $cp.port "/etc/nexiqon/link" true) | nindent 8 }}
        {{- end }}
        {{- range $cell, $c := $cells }}
        {{- include "nexiqon.tlsCluster" (list (printf "cell-%s" $cell) $c.host ($c.port | default 443) "/etc/nexiqon/cells" false) | nindent 8 }}
        {{- end }}
        {{- range $host, $_ := $hosts }}
        - name: {{ $host }}
          type: STRICT_DNS
          connect_timeout: 2s
          load_assignment:
            cluster_name: {{ $host }}
            endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: {{ $host }}, port_value: {{ $port }} } } } }] }]
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "nexiqon.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: {{- include "nexiqon.selector" (dict "root" . "name" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexiqon.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ "gateway" }}
      annotations:
        checksum/config: {{ .Values.groups | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: envoy
          image: {{ .Values.gateway.image }}
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
          ports:
            - { name: http, containerPort: 8080 }
            {{- if $remote }}
            - { name: control-link, containerPort: 8081 }
            {{- end }}
            {{- if $link.enabled }}
            - { name: dp-link, containerPort: 8443 }
            {{- end }}
          readinessProbe:
            httpGet: { path: /gateway/healthz, port: http }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/envoy, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if $remote }}
            - { name: link, mountPath: /etc/nexiqon/link, readOnly: true }
            {{- end }}
            {{- if $link.enabled }}
            - { name: link-server, mountPath: /etc/nexiqon/link-server, readOnly: true }
            {{- end }}
            {{- if $cells }}
            - { name: cells, mountPath: /etc/nexiqon/cells, readOnly: true }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: nexiqon-gateway }
        - name: tmp
          emptyDir: {}
        {{- if $remote }}
        - name: link   # tls.crt, tls.key (this data plane's client certificate), ca.crt (the control plane's)
          secret: { secretName: {{ $cp.tls.secretName }} }
        {{- end }}
        {{- if $link.enabled }}
        - name: link-server   # tls.crt, tls.key (the link's server certificate), ca.crt (the data planes' CA)
          secret: { secretName: {{ $link.tls.secretName }} }
        {{- end }}
        {{- if $cells }}
        - name: cells   # ca.crt that signs the cells' gateway certificates
          secret: { secretName: {{ .Values.cellsCaSecret }} }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {{- include "nexiqon.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector: {{- include "nexiqon.selector" (dict "root" . "name" "gateway") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.gateway.service.port }}, targetPort: http }
{{- if $remote }}
---
# In-cluster only: data-plane services' way to the control plane (never exposed).
apiVersion: v1
kind: Service
metadata:
  name: control-link
  labels: {{- include "nexiqon.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "nexiqon.selector" (dict "root" . "name" "gateway") | nindent 4 }}
  ports:
    - { name: http, port: 8081, targetPort: control-link }
{{- end }}
{{- if $link.enabled }}
---
# The link data planes connect to (mTLS; expose with a TCP load balancer, TLS passthrough).
apiVersion: v1
kind: Service
metadata:
  name: data-plane-link
  labels: {{- include "nexiqon.labels" . | nindent 4 }}
spec:
  type: {{ $link.service.type }}
  selector: {{- include "nexiqon.selector" (dict "root" . "name" "gateway") | nindent 4 }}
  ports:
    - { name: https, port: 8443, targetPort: dp-link }
{{- end }}
{{- with .Values.gateway.ingress }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels: {{- include "nexiqon.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .tls.secretName }}
  tls: [{ hosts: [{{ .host | quote }}], secretName: {{ .tls.secretName }} }]
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
{{- end }}
{{- end }}
{{- end }}
