{{- if .Values.gateway.enabled }}
{{- $port := int .Values.topology.port }}
{{- $identity := include "nexiqon.hostFor" (list . "identity") }}
{{- $internal := list "authz" "model-gateway" }}
{{- $streaming := list "agent-runtime" "conversation" }}
{{- $widget := list "conversation" "channel" }}
{{- $hosts := dict }}
# Edge gateway (PL-01), generated from the groups: strips any client-sent context header and the
# diagnostics proof, asks identity (ext_authz) for a signed tenant context, routes /<service>/...
# Internal-only services (authz, model-gateway) and /identity/internal/* are never routed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexiqon-gateway
  labels: {{- include "nexiqon.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: public
          address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: public
                    use_remote_address: true
                    generate_request_id: true
                    route_config:
                      name: nexiqon
                      virtual_hosts:
                        - name: nexiqon
                          domains: ["*"]
                          routes:
                            - match: { path: /gateway/healthz }
                              direct_response: { status: 200, body: { inline_string: "ok" } }
                              typed_per_filter_config: &no_authz
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                            - match: { prefix: /identity/internal/ }
                              direct_response: { status: 404 }
                              typed_per_filter_config: *no_authz
                            {{- range $svc := $internal }}
                            - match: { prefix: /{{ $svc }}/ }
                              direct_response: { status: 404 }
                              typed_per_filter_config: *no_authz
                            {{- end }}
                            {{- range $p := list "/identity/v1/session/" "/identity/v1/webhooks/" "/identity/.well-known/" }}
                            - match: { prefix: {{ $p }} }
                              route: { cluster: {{ $identity }} }
                              typed_per_filter_config: *no_authz
                            {{- end }}
                            - match: { prefix: /config/.well-known/ }
                              route: { cluster: {{ include "nexiqon.hostFor" (list $ "config") }} }
                              typed_per_filter_config: *no_authz
                            {{- range $name, $g := .Values.groups }}
                            {{- if $g.enabled }}
                            {{- range $svc := $g.services }}
                            {{- if not (has $svc $internal) }}
                            {{- $host := include "nexiqon.hostFor" (list $ $svc) }}
                            {{- $_ := set $hosts $host true }}
                            - match: { prefix: /{{ $svc }}/ }
                              route: { cluster: {{ $host }}{{ if has $svc $streaming }}, timeout: 180s{{ end }} }
                              {{- if has $svc $widget }}
                              typed_per_filter_config:
                                envoy.filters.http.cors:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                                  allow_origin_string_match: [{ safe_regex: { regex: {{ $.Values.gateway.corsOriginRegex | quote }} } }]
                                  allow_methods: "GET, POST, DELETE, OPTIONS"
                                  allow_headers: "authorization, content-type, x-nexiqon-visitor, x-nexiqon-tenant"
                                  max_age: "600"
                                  allow_credentials: false
                              {{- end }}
                            {{- end }}
                            {{- end }}
                            {{- end }}
                            {{- end }}
                    http_filters:
                      - name: envoy.filters.http.cors
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      - name: envoy.filters.http.header_mutation
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                          mutations:
                            request_mutations:
                              - remove: x-nexiqon-context
                              - remove: x-nexiqon-diagnostics
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          failure_mode_allow: false
                          http_service:
                            server_uri:
                              uri: http://{{ $identity }}:{{ $port }}
                              cluster: {{ $identity }}
                              timeout: 2s
                            path_prefix: /identity/internal/ext-authz
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: authorization
                                  - exact: x-nexiqon-tenant
                                  - exact: origin
                                  - exact: x-nexiqon-visitor
                            authorization_response:
                              allowed_upstream_headers:
                                patterns:
                                  - exact: x-nexiqon-context
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        {{- $_ := set $hosts $identity true }}
        {{- range $host, $_ := $hosts }}
        - name: {{ $host }}
          type: STRICT_DNS
          connect_timeout: 2s
          load_assignment:
            cluster_name: {{ $host }}
            endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: {{ $host }}, port_value: {{ $port }} } } } }] }]
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "nexiqon.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: {{- include "nexiqon.selector" (dict "root" . "name" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexiqon.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ "gateway" }}
      annotations:
        checksum/config: {{ .Values.groups | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: envoy
          image: {{ .Values.gateway.image }}
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /gateway/healthz, port: http }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/envoy, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: nexiqon-gateway }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {{- include "nexiqon.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector: {{- include "nexiqon.selector" (dict "root" . "name" "gateway") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.gateway.service.port }}, targetPort: http }
{{- with .Values.gateway.ingress }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels: {{- include "nexiqon.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .tls.secretName }}
  tls: [{ hosts: [{{ .host | quote }}], secretName: {{ .tls.secretName }} }]
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
{{- end }}
{{- end }}
{{- end }}
