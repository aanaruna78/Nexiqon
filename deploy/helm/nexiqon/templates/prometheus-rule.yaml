{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nexiqon
  labels:
    {{- include "nexiqon.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- $rules := .Files.Get "files/prometheus-rules.yaml" | fromYaml }}
  groups: {{- toYaml $rules.groups | nindent 4 }}
{{- end }}
