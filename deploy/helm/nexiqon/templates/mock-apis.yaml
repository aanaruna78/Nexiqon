{{- if .Values.mockApis.enabled }}
# Demo business APIs (two synthetic customers). Development and demos only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-apis
  labels: {{- include "nexiqon.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "nexiqon.selector" (dict "root" . "name" "mock-apis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexiqon.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ "mock-apis" }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mock-apis
          image: {{ include "nexiqon.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "uvicorn", "nexiqon_tool_gateway.mock_apis:app", "--host", "0.0.0.0", "--port", "9000"]
          ports:
            - { name: http, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-apis
  labels: {{- include "nexiqon.labels" . | nindent 4 }}
spec:
  selector: {{- include "nexiqon.selector" (dict "root" . "name" "mock-apis") | nindent 4 }}
  ports:
    - { name: http, port: 9000, targetPort: http }
{{- end }}
