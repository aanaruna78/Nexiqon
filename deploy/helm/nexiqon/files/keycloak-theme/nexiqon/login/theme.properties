# Nexiqon sign-in theme (Keycloak 26). Extends the built-in "keycloak" theme so every page
# (sign-in, password reset, MFA setup, errors) keeps working; layout in template.ftl, look in
# resources/css/nexiqon.css. Used by the dev realm (deploy/compose/keycloak/nexiqon-realm.json).
parent=keycloak
import=common/keycloak
styles=css/login.css css/nexiqon.css
meta=viewport==width=device-width,initial-scale=1
locales=en,fr,es,de,ar
kcButtonLargeClass=nx-button-lg
