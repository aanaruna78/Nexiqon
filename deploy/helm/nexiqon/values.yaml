# Nexiqon Helm chart (DV-02). Profiles in values/: saas.yaml, private.yaml, kind.yaml.
#
# Nothing cloud-specific lives here: managed databases, buckets and keys are referenced by name
# (existing Secrets), so the same chart runs on DigitalOcean, AWS, GCP, Azure or on premises.

image:
  repository: nexiqon/platform
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# grouped: one Deployment per group below (deploy/groups.yaml). split: one per service.
topology:
  mode: grouped
  port: 8000

# Deployment groups. Moving a service between groups is configuration only. `keyFiles` names the
# files from keys.existingSecret this group needs (service identities stay with their service).
groups:
  control-core:
    enabled: true
    plane: control
    services: [identity, authz, config, audit]
    replicas: 2
    keyFiles: [secrets.yaml, service-keys.yaml]
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
  control-ops:
    enabled: true
    plane: control
    services: [evaluation, metering, governance, notification]
    replicas: 1
    keyFiles: [secrets.yaml, service-keys.yaml, identity-evaluation.yaml, identity-metering.yaml]
    # Outgoing email (notification): "memory" sends nothing; set smtp for a real relay and put
    # its password in the nexiqon-smtp Secret (key: password).
    settings:
      email: { backend: memory }
    env:
      - { name: NEXIQON_EMAIL__PASSWORD, valueFrom: { secretKeyRef: { name: nexiqon-smtp, key: password, optional: true } } }
    resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 768Mi } }
  knowledge:
    enabled: true
    plane: data
    services: [ingestion, retrieval]
    replicas: 2
    keyFiles: [secrets.yaml, service-keys.yaml, identity-ingestion.yaml]
    settings:
      blobs: { backend: s3, endpoint: "http://objectstore:8333", bucket: nexiqon, region: us-east-1 }
      scan: { backend: clamav, clamd_host: clamav, clamd_port: 3310 }
    env:
      - { name: NEXIQON_BLOBS__ACCESS_KEY, valueFrom: { secretKeyRef: { name: nexiqon-blobs, key: access_key, optional: true } } }
      - { name: NEXIQON_BLOBS__SECRET_KEY, valueFrom: { secretKeyRef: { name: nexiqon-blobs, key: secret_key, optional: true } } }
    resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 2Gi } }
  agent:
    enabled: true
    plane: data
    services: [agent-runtime, conversation, channel]
    replicas: 2
    keyFiles: [secrets.yaml, service-keys.yaml, identity-agent-runtime.yaml, identity-channel.yaml, identity-conversation.yaml]
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
  tool-gateway:
    enabled: true
    plane: data
    services: [tool-gateway]
    replicas: 2
    keyFiles: [secrets.yaml, service-keys.yaml, identity-tool-gateway.yaml]
    settings:
      secrets: { backend: openbao, address: "http://openbao:8200", mount: secret }
    env:
      - { name: NEXIQON_SECRETS__TOKEN, valueFrom: { secretKeyRef: { name: nexiqon-openbao, key: token, optional: true } } }
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
  model-gateway:
    enabled: true
    plane: data
    services: [model-gateway]
    replicas: 2
    keyFiles: [secrets.yaml, service-keys.yaml]
    env:  # model provider keys; providers without a key fail closed
      - { name: NEXIQON_PROVIDERS__OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: nexiqon-providers, key: OPENAI_API_KEY, optional: true } } }
      - { name: NEXIQON_PROVIDERS__ANTHROPIC_API_KEY, valueFrom: { secretKeyRef: { name: nexiqon-providers, key: ANTHROPIC_API_KEY, optional: true } } }
      - { name: NEXIQON_PROVIDERS__GEMINI_API_KEY, valueFrom: { secretKeyRef: { name: nexiqon-providers, key: GEMINI_API_KEY, optional: true } } }
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }

# Non-secret settings shared by every group (one YAML layer, like deploy/compose/config/dev.yaml).
# Endpoints below match the bundled dependencies; point them at managed services otherwise.
settings:
  environment: prod
  log_json: true
  context_cache_seconds: 30
  opa_url: http://opa:8181
  idp_providers: []   # e.g. [{name: keycloak, kind: keycloak, issuer: ..., jwks_url: ..., audiences: []}]
  events: { enabled: true, nats_url: "nats://nats:4222" }
  flags: { provider: flagd, flagd_host: flagd, flagd_port: 8013 }
  workflows: { enabled: true, address: "temporal:7233" }

# Existing Secrets (never generated by the chart; create them from OpenBao/External Secrets or
# `tools/dev/k8s_secrets.py` for evaluation clusters).
# Other Secrets referenced by groups[].env: nexiqon-blobs (access_key, secret_key),
# nexiqon-openbao (token), nexiqon-providers (OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY).
database:
  existingSecret: nexiqon-database   # keys: url (application role), migrationUrl (owner role)
keys:
  existingSecret: nexiqon-keys        # files: secrets.yaml, service-keys.yaml, identity-*.yaml

# Extra environment for every group (e.g. telemetry).
extraEnv: []

migrations:
  enabled: true   # a pre-install/pre-upgrade hook runs every service's migrations once

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

gateway:
  enabled: true
  image: envoyproxy/envoy:v1.40.0
  replicas: 2
  service: { type: ClusterIP, port: 8080 }
  # Origins for the widget's CORS preflight; which origins a widget key may use is still checked
  # by identity for every request.
  corsOriginRegex: "https?://.+"
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: { secretName: "" }
    annotations: {}
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 256Mi } }

opa:
  enabled: true
  image: openpolicyagent/opa:0.70.0
  replicas: 2
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }

flagd:
  enabled: true
  image: ghcr.io/open-feature/flagd:v0.14.0
  resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 128Mi } }

studio:
  enabled: true
  image: { repository: nexiqon/studio, tag: "" }
  replicas: 2
  baseUrl: ""          # public URL, e.g. https://studio.example.com
  environment: production
  oidc: { issuer: "", clientId: nexiqon-studio }
  existingSecret: nexiqon-studio   # keys: STUDIO_SESSION_SECRET, optional OIDC_CLIENT_SECRET
  service: { port: 3000 }
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: { secretName: "" }
    annotations: {}
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }

# Demo business APIs (two synthetic customers). Development and demos only.
mockApis:
  enabled: false

# Single-replica dependencies for evaluation and CI clusters (kind). NOT for production: use
# managed PostgreSQL (pgvector), Valkey, NATS JetStream, S3 storage, Temporal and an IdP instead.
bundled:
  enabled: false
  storageClass: ""
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    database: nexiqon
    ownerPassword: nexiqon_dev
    appPassword: nexiqon_app_dev
    size: 5Gi
  valkey: { image: valkey/valkey:8.0-alpine }
  nats: { image: nats:2.15.1-alpine, size: 1Gi }
  objectstore: { image: chrislusf/seaweedfs:4.48, size: 5Gi }
  temporal: { image: temporalio/auto-setup:1.26.2 }
  keycloak:
    enabled: true
    image: quay.io/keycloak/keycloak:26.0
    hostname: http://localhost:8080   # issuer browsers and Nexiqon see
    adminPassword: admin_dev
  openbao:
    enabled: true
    image: openbao/openbao:2.1.0
    devRootToken: nexiqon-dev-root
  clamav:
    enabled: false
    image: clamav/clamav:1.4
