# Nexiqon Helm chart (DV-02). Profiles in values/: saas.yaml, private.yaml, minimal.yaml (DV-09),
# hybrid-data.yaml (DV-04), kind.yaml. One server without Kubernetes: deploy/single-node.
#
# Nothing cloud-specific lives here: managed databases, buckets and keys are referenced by name
# (existing Secrets), so the same chart runs on DigitalOcean, AWS, GCP, Azure or on premises.

image:
  repository: nexiqon/platform
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# grouped: one Deployment per group below (deploy/groups.yaml). split: one per service.
topology:
  mode: grouped
  port: 8000

# Deployment groups. Moving a service between groups is configuration only. `keyFiles` names the
# files from keys.existingSecret this group needs: service identities stay with their service, and
# the signing private keys (secrets.yaml) only with identity and config; the rest get public-keys.yaml.
groups:
  control-core:
    enabled: true
    plane: control
    services: [identity, authz, config, audit]
    replicas: 2
    keyFiles: [secrets.yaml, service-keys.yaml]
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
  control-ops:
    enabled: true
    plane: control
    services: [evaluation, metering, governance, notification]
    replicas: 1
    keyFiles: [public-keys.yaml, service-keys.yaml, identity-evaluation.yaml, identity-metering.yaml, identity-governance.yaml]
    # Outgoing email (notification): "memory" sends nothing; set smtp for a real relay and put
    # its password in the nexiqon-smtp Secret (key: password).
    settings:
      email: { backend: memory }
      blobs: { backend: s3, endpoint: "http://objectstore:8333", bucket: nexiqon, region: us-east-1 }
    env:
      - { name: NEXIQON_EMAIL__PASSWORD, valueFrom: { secretKeyRef: { name: nexiqon-smtp, key: password, optional: true } } }
      - { name: NEXIQON_BLOBS__ACCESS_KEY, valueFrom: { secretKeyRef: { name: nexiqon-blobs, key: access_key, optional: true } } }
      - { name: NEXIQON_BLOBS__SECRET_KEY, valueFrom: { secretKeyRef: { name: nexiqon-blobs, key: secret_key, optional: true } } }
    resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 768Mi } }
  knowledge:
    enabled: true
    plane: data
    services: [ingestion, retrieval]
    replicas: 2
    keyFiles: [public-keys.yaml, service-keys.yaml, identity-ingestion.yaml]
    settings:
      blobs: { backend: s3, endpoint: "http://objectstore:8333", bucket: nexiqon, region: us-east-1 }
      scan: { backend: clamav, clamd_host: clamav, clamd_port: 3310 }
    env:
      - { name: NEXIQON_BLOBS__ACCESS_KEY, valueFrom: { secretKeyRef: { name: nexiqon-blobs, key: access_key, optional: true } } }
      - { name: NEXIQON_BLOBS__SECRET_KEY, valueFrom: { secretKeyRef: { name: nexiqon-blobs, key: secret_key, optional: true } } }
    resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 2Gi } }
  agent:
    enabled: true
    plane: data
    services: [agent-runtime, conversation, channel]
    replicas: 2
    keyFiles: [public-keys.yaml, service-keys.yaml, identity-agent-runtime.yaml, identity-channel.yaml, identity-conversation.yaml]
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
  tool-gateway:
    enabled: true
    plane: data
    services: [tool-gateway]
    replicas: 2
    keyFiles: [public-keys.yaml, service-keys.yaml, identity-tool-gateway.yaml]
    settings:
      secrets: { backend: openbao, address: "http://openbao:8200", mount: secret }
    env:
      - { name: NEXIQON_SECRETS__TOKEN, valueFrom: { secretKeyRef: { name: nexiqon-openbao, key: token, optional: true } } }
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
  model-gateway:
    enabled: true
    plane: data
    services: [model-gateway]
    replicas: 2
    keyFiles: [public-keys.yaml, service-keys.yaml]
    env:  # model provider keys; providers without a key fail closed
      - { name: NEXIQON_PROVIDERS__OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: nexiqon-providers, key: OPENAI_API_KEY, optional: true } } }
      - { name: NEXIQON_PROVIDERS__ANTHROPIC_API_KEY, valueFrom: { secretKeyRef: { name: nexiqon-providers, key: ANTHROPIC_API_KEY, optional: true } } }
      - { name: NEXIQON_PROVIDERS__GEMINI_API_KEY, valueFrom: { secretKeyRef: { name: nexiqon-providers, key: GEMINI_API_KEY, optional: true } } }
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }

# Non-secret settings shared by every group (one YAML layer, like deploy/compose/config/dev.yaml).
# Endpoints below match the bundled dependencies; point them at managed services otherwise.
settings:
  environment: prod
  log_json: true
  context_cache_seconds: 30
  opa_url: http://opa:8181
  idp_providers: []   # e.g. [{name: keycloak, kind: keycloak, issuer: ..., jwks_url: ..., audiences: []}]
  events: { enabled: true, nats_url: "nats://nats:4222" }
  flags: { provider: flagd, flagd_host: flagd, flagd_port: 8013 }
  workflows: { enabled: true, address: "temporal:7233" }

# Existing Secrets (never generated by the chart; create them from OpenBao/External Secrets or
# `tools/dev/k8s_secrets.py` for evaluation clusters).
# Other Secrets referenced by groups[].env: nexiqon-blobs (access_key, secret_key),
# nexiqon-openbao (token), nexiqon-providers (OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY).
database:
  existingSecret: nexiqon-database   # keys: url (application role), migrationUrl (owner role)

# Hybrid data plane (DV-04): the control plane this release connects out to. Set on a data-plane-only
# install (values/hybrid-data.yaml); empty everywhere else.
controlPlane:
  host: ""
  port: 8443
  tls: { secretName: nexiqon-control-plane-link }   # tls.crt, tls.key (client), ca.crt

# Region cells (DV-07): tenants whose region is listed are sent to that region's gateway, so their
# data stays in their region. Example: { eu: { host: eu.api.example.com, port: 443 } }
cells: {}
cellsCaSecret: nexiqon-cells-ca

# Default-deny network policies (S-02): pods take traffic only from this release (and the
# gateway and Studio from the ingress), and no pod can reach the cloud metadata address.
networkPolicy:
  enabled: true
  # Where the ingress controller runs, for the gateway and Studio; empty = from anywhere.
  ingressNamespace: ""
  # Where Prometheus (or the OTel collector) runs, to scrape every pod; empty = none.
  monitoringNamespace: ""

# Alert rules (S-03) as a PrometheusRule, for the Prometheus Operator; runbooks in
# docs/runbooks/alerts.md. Without the operator, load files/prometheus-rules.yaml directly.
monitoring:
  prometheusRule:
    enabled: false
    labels: {}

# Nightly logical backup of the platform database to a volume (G-03). Managed databases have their
# own backups and point-in-time recovery: keep this off there, or on as a second, portable copy.
# Restore and the timed drill: docs/runbooks/backup-restore.md.
backup:
  enabled: false
  schedule: "30 2 * * *"
  keepDays: 7
  image: postgres:16.10
  storage: { size: 20Gi, storageClass: "" }
keys:
  existingSecret: nexiqon-keys        # files: secrets.yaml, service-keys.yaml, identity-*.yaml

# Extra environment for every group (e.g. telemetry).
extraEnv: []

migrations:
  enabled: true   # a pre-install/pre-upgrade hook runs every service's migrations once

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

gateway:
  enabled: true
  image: envoyproxy/envoy:v1.40.0
  hsts: false   # on where TLS ends at or before the gateway (the SaaS and private profiles)
  rateLimit: { enabled: true, perSecond: 200, burst: 400 }   # per gateway pod
  # Control plane only (DV-04): the mutual-TLS link hybrid data planes connect to.
  dataPlaneLink:
    enabled: false
    tls: { secretName: nexiqon-data-plane-link }   # tls.crt, tls.key, ca.crt (the data planes' CA)
    service: { type: LoadBalancer }
  replicas: 2
  service: { type: ClusterIP, port: 8080 }
  # Origins for the widget's CORS preflight; which origins a widget key may use is still checked
  # by identity for every request.
  corsOriginRegex: "https?://.+"
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: { secretName: "" }
    annotations: {}
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 256Mi } }

opa:
  enabled: true
  image: openpolicyagent/opa:0.70.0
  replicas: 2
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }

flagd:
  enabled: true
  image: ghcr.io/open-feature/flagd:v0.14.0
  resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 128Mi } }

studio:
  enabled: true
  image: { repository: nexiqon/studio, tag: "" }
  replicas: 2
  baseUrl: ""          # public URL, e.g. https://studio.example.com
  environment: production
  oidc: { issuer: "", clientId: nexiqon-studio }
  existingSecret: nexiqon-studio   # keys: STUDIO_SESSION_SECRET, optional OIDC_CLIENT_SECRET
  service: { port: 3000 }
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: { secretName: "" }
    annotations: {}
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }

# Self-hosted models on a GPU node (M-06, DV-09): vLLM servers for the on-prem-small and
# on-prem-standard model profiles. Sizing: docs/guides/minimal-footprint.md.
models:
  enabled: false
  image: vllm/vllm-openai:v0.11.0
  nodeSelector: { nexiqon.dev/pool: gpu }   # the label the OpenTofu modules give GPU pools
  tolerations:
    - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
  offline: false          # true: never download (air-gapped; preload the weights into the volume)
  hfTokenSecret: ""       # Secret with key "token", for gated models
  cache: { size: 100Gi, storageClass: "" }
  servers:
    vllm:
      enabled: true
      memory: 24Gi
      args:
        - --model=Qwen/Qwen3-8B-AWQ
        - --served-model-name=qwen3-8b
        - --max-model-len=32768
        - --gpu-memory-utilization=0.80
        - --enable-auto-tool-choice
        - --tool-call-parser=hermes
        - --guided-decoding-backend=xgrammar
    vllm-embed:
      enabled: true
      memory: 8Gi
      args:
        - --model=Qwen/Qwen3-Embedding-0.6B
        - --served-model-name=qwen3-embedding-0.6b
        - --task=embed
        - --max-model-len=8192
        - --gpu-memory-utilization=0.08
    vllm-rerank:
      enabled: true
      memory: 8Gi
      args:
        - --model=Qwen/Qwen3-Reranker-0.6B
        - --served-model-name=qwen3-reranker-0.6b
        - --task=score
        - --max-model-len=8192
        - --gpu-memory-utilization=0.08
        - '--hf-overrides={"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'

# Demo business APIs (two synthetic customers). Development and demos only.
mockApis:
  enabled: false

# Single-replica dependencies for evaluation and CI clusters (kind). NOT for production: use
# managed PostgreSQL (pgvector), Valkey, NATS JetStream, S3 storage, Temporal and an IdP instead.
bundled:
  enabled: false
  storageClass: ""
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    database: nexiqon
    ownerPassword: nexiqon_dev
    appPassword: nexiqon_app_dev
    size: 5Gi
  valkey: { image: valkey/valkey:8.0-alpine }
  nats: { image: nats:2.15.1-alpine, size: 1Gi }
  objectstore: { image: chrislusf/seaweedfs:4.48, size: 5Gi }
  temporal: { image: temporalio/auto-setup:1.26.2 }
  keycloak:
    enabled: true
    image: quay.io/keycloak/keycloak:26.0
    hostname: http://localhost:8080   # issuer browsers and Nexiqon see
    adminPassword: admin_dev
  openbao:
    enabled: true
    image: openbao/openbao:2.1.0
    devRootToken: nexiqon-dev-root
  clamav:
    enabled: false
    image: clamav/clamav:1.4
